name: Publish dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write dashboard config
        env:
          DASHBOARD_CONFIG_TOML: ${{ secrets.DASHBOARD_CONFIG_TOML }}
        run: |
          if [ -z "$DASHBOARD_CONFIG_TOML" ]; then
            echo "Missing secret DASHBOARD_CONFIG_TOML"
            exit 1
          fi
          mkdir -p private
          printf '%s\n' "$DASHBOARD_CONFIG_TOML" > private/config.toml

      - name: Restore Garmin tokenstore
        env:
          GARMIN_TOKENSTORE_TGZ_B64: ${{ secrets.GARMIN_TOKENSTORE_TGZ_B64 }}
        run: |
          if [ -z "$GARMIN_TOKENSTORE_TGZ_B64" ]; then
            echo "Missing secret GARMIN_TOKENSTORE_TGZ_B64"
            exit 1
          fi
          mkdir -p "$HOME/.garminconnect"
          printf '%s' "$GARMIN_TOKENSTORE_TGZ_B64" | base64 --decode > /tmp/garmin-tokenstore.tgz
          tar -xzf /tmp/garmin-tokenstore.tgz -C "$HOME/.garminconnect"

      - name: Sync and build pages
        run: |
          python garmin_sync.py
          python build_dashboard.py

      - name: Prepare public artifact
        run: |
          mkdir -p public
          cp dashboard.html season.html health.html public/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
