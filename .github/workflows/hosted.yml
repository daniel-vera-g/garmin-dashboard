# Scheduled sync + build, deployed to Cloudflare Pages behind Cloudflare Access.
# Off unless the repository variable HOSTED_ENABLED is "true" (see docs/hosting.md).
#
# Privacy rules for this public repo:
# - personal config and Garmin tokens come from secrets, never from the repo;
# - the Garmin cache between runs is stored ENCRYPTED (actions cache is readable by
#   workflows of pull requests, logs are public); only the two openssl steps see the key;
# - sync and deploy output is not printed - only a failure category;
# - pages go straight to Cloudflare (no GitHub Pages, no downloadable artifact) and
#   are built with --hosted: no Coach data, no Sync.
# Third-party actions are pinned by commit.
name: Hosted dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"      # every 3 hours; ~9 Garmin calls per run with a warm cache

permissions:
  contents: read

concurrency:
  group: hosted-dashboard
  cancel-in-progress: false

jobs:
  publish:
    if: vars.HOSTED_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: ${{ vars.TZ || 'UTC' }}     # the athlete's timezone: "today", weeks and clock times
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262       # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Restore encrypted cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: state.enc
          key: hosted-state-${{ github.run_id }}
          restore-keys: hosted-state-

      - name: Config and Garmin tokens
        env:
          DASHBOARD_CONFIG_TOML: ${{ secrets.DASHBOARD_CONFIG_TOML }}
          GARMIN_TOKENSTORE_TGZ_B64: ${{ secrets.GARMIN_TOKENSTORE_TGZ_B64 }}
        run: |
          umask 077
          for v in DASHBOARD_CONFIG_TOML GARMIN_TOKENSTORE_TGZ_B64; do
            [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }
          done
          mkdir -p private
          printf '%s\n' "$DASHBOARD_CONFIG_TOML" > private/config.toml
          # the tokenstore path the config names ([sync] tokenstore)
          TOKENS="$(python -c 'import settings, pathlib; print(pathlib.Path(settings.load_athlete()["sync"]["tokenstore"]).expanduser())')"
          echo "TOKENS=$TOKENS" >> "$GITHUB_ENV"
          mkdir -p "$TOKENS"
          printf '%s' "$GARMIN_TOKENSTORE_TGZ_B64" | base64 --decode | tar -xz -C "$TOKENS"
          printf '%s' "$GARMIN_TOKENSTORE_TGZ_B64" | sha256sum | cut -d' ' -f1 > secret-tokens.sha

      - name: Decrypt cache
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: |
          umask 077
          [ -n "$CACHE_KEY" ] || { echo "missing secret CACHE_KEY"; exit 1; }
          [ -f state.enc ] || { echo "no cache yet - first run backfills"; exit 0; }
          mkdir -p state
          # extracted into the workspace only; GNU tar refuses absolute and ../ paths
          if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_KEY -in state.enc | tar -xz -C state; then
            mkdir -p data && rm -rf data/cache && { [ -d state/cache ] && mv state/cache data/cache || true; }
            # tokens refreshed by an earlier run win - unless new ones were uploaded since
            # (./run.sh login + ./run.sh hosted-secrets after they expired)
            if [ -d state/tokens ] && [ "$(cat state/secret-tokens.sha 2>/dev/null)" = "$(cat secret-tokens.sha)" ]; then
              cp -a state/tokens/. "$TOKENS"/
            fi
          else
            echo "cache unreadable - starting fresh"
          fi
          rm -rf state

      - name: Sync (output withheld - public logs)
        run: |
          set +e
          python garmin_sync.py > /dev/null 2>&1
          rc=$?
          case $rc in
            0) echo "sync ok" ;;
            3) echo "sync failed: Garmin login - run ./run.sh login, then ./run.sh hosted-secrets"; exit 1 ;;
            4) echo "sync failed: Garmin returned no data (outage or rate limit) - retried next run"; exit 1 ;;
            *) echo "sync failed: exit $rc"; exit 1 ;;
          esac

      - name: Build hosted pages
        run: |
          python build_dashboard.py --hosted --out public > /dev/null
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n  Referrer-Policy: no-referrer\n  X-Content-Type-Options: nosniff\n' > public/_headers

      - name: Encrypt cache
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: |
          umask 077
          mkdir -p state/tokens
          cp -a data/cache state/cache
          cp -a "$TOKENS"/. state/tokens/
          cp secret-tokens.sha state/
          tar -cz -C state . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CACHE_KEY -out state.enc
          rm -rf state

      - name: Save encrypted cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830      # v4.3.0
        with:
          path: state.enc
          key: hosted-state-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages (output withheld - it names the deployment URL)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.17 pages deploy public \
            --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main > /dev/null 2>&1 \
            && echo "deployed" || { echo "deploy failed (check the Cloudflare token and project name)"; exit 1; }
